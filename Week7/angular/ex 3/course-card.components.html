<div class="card"
     [ngClass]="cardClasses"
     [ngStyle]="{
      'border-left':
      course.gradeStatus=='passed'
      ? '6px solid green'
      : course.gradeStatus=='failed'
      ? '6px solid red'
      : '6px solid gray'
     }">

    <h3>{{course.name}}</h3>

    <p><b>ID :</b> {{course.id}}</p>

    <p><b>Code :</b> {{course.code}}</p>

    <p><b>Credits :</b> {{course.credits}}</p>

    <div [ngSwitch]="course.gradeStatus">

        <span *ngSwitchCase="'passed'" style="color:green">
            Passed
        </span>

        <span *ngSwitchCase="'failed'" style="color:red">
            Failed
        </span>

        <span *ngSwitchDefault style="color:gray">
            Pending
        </span>

    </div>

    <br>

    <button (click)="onEnroll()">
        Enroll
    </button>

    <button (click)="toggleDetails()">
        Show Details
    </button>

</div>
