<div class="container">

    <h2>Student Course Enrollment Form</h2>

    <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

        <!-- Student Name -->

        <label>Student Name</label>

        <input
                type="text"
                formControlName="studentName">

        <div
                *ngIf="enrollForm.get('studentName')?.touched &&
                   enrollForm.get('studentName')?.invalid">

            <small *ngIf="enrollForm.get('studentName')?.errors?.['required']">
                Name is required.
            </small>

            <small *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">
                Minimum 3 characters required.
            </small>

        </div>

        <br><br>

        <!-- Email -->

        <label>Email</label>

        <input
                type="email"
                formControlName="studentEmail">

        <div
                *ngIf="enrollForm.get('studentEmail')?.touched &&
                   enrollForm.get('studentEmail')?.invalid">

            <small *ngIf="enrollForm.get('studentEmail')?.errors?.['required']">
                Email is required.
            </small>

            <small *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">
                Invalid email.
            </small>

            <small *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
                Email already exists.
            </small>

        </div>

        <br><br>

        <!-- Course ID -->

        <label>Course ID</label>

        <input
                type="text"
                formControlName="courseId">

        <div
                *ngIf="enrollForm.get('courseId')?.touched &&
                   enrollForm.get('courseId')?.invalid">

            <small *ngIf="enrollForm.get('courseId')?.errors?.['required']">
                Course ID is required.
            </small>

            <small *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
                Course ID cannot start with XX.
            </small>

        </div>

        <br><br>

        <!-- Semester -->

        <label>Preferred Semester</label>

        <select formControlName="preferredSemester">

            <option value="Odd">Odd</option>

            <option value="Even">Even</option>

        </select>

        <br><br>

        <!-- Terms -->

        <label>

            <input
                    type="checkbox"
                    formControlName="agreeToTerms">

            I Agree to Terms & Conditions

        </label>

        <div
                *ngIf="enrollForm.get('agreeToTerms')?.touched &&
                   enrollForm.get('agreeToTerms')?.invalid">

            <small>Please accept the terms.</small>

        </div>

        <br><br>

        <!-- Additional Courses -->

        <h3>Additional Courses</h3>

        <button
                type="button"
                (click)="addCourse()">

            Add Course

        </button>

        <br><br>

        <div formArrayName="additionalCourses">

            <div
                    *ngFor="let course of additionalCourses.controls; let i=index">

                <input
                        [formControlName]="i"
                        placeholder="Course Name">

                <button
                        type="button"
                        (click)="removeCourse(i)">

                    Remove

                </button>

                <br><br>

            </div>

        </div>

        <button
                type="submit"
                [disabled]="enrollForm.invalid">

            Submit

        </button>

    </form>

</div>
